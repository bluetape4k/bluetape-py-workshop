<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="titleId desc">
  <title id="titleId">Bounded catalog enrichment sequence</title>
  <desc id="desc">Product identifiers become one globally bounded provider job list with explicit success, warning, failure, timeout, and cancellation behavior.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .frame { fill: #fbf8f1; stroke: #d7ccc8; stroke-width: 3; }
      .title { font: 42px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .subtitle { font: 21px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #546e7a; }
      .header { stroke-width: 3; }
      .participant { font: 23px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; text-anchor: middle; }
      .role { font: 15px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; text-anchor: middle; }
      .lifeline { fill: none; stroke: #b0bec5; stroke-width: 3; stroke-dasharray: 10 9; }
      .activation { fill: #dcebf4; stroke: #5f8da8; stroke-width: 2; }
      .callBlue { fill: none; stroke: #5f8da8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .callGreen { fill: none; stroke: #6f9a65; stroke-width: 4; marker-end: url(#arrow-green); }
      .callAmber { fill: none; stroke: #b07a36; stroke-width: 4; marker-end: url(#arrow-amber); }
      .callRed { fill: none; stroke: #c56b5d; stroke-width: 4; marker-end: url(#arrow-red); }
      .callPurple { fill: none; stroke: #8e72b5; stroke-width: 4; marker-end: url(#arrow-purple); }
      .returnBlue { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-blue); }
      .returnGreen { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-green); }
      .returnAmber { fill: none; stroke: #b07a36; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-amber); }
      .label { stroke-width: 2; }
      .num { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .detail { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #37474f; }
      .alt { fill: #ffffff; fill-opacity: 0.10; stroke: #90a4ae; stroke-width: 3; }
      .branchDivider { stroke: #90a4ae; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .branchLabel { font: 18px 'Architects Daughter', 'Comic Sans MS', cursive; font-weight: 700; }
      .note { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8da8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f9a65"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b07a36"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c56b5d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8e72b5"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#455a64" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="35" y="35" width="1730" height="1180" rx="28" class="frame"/>
  <text x="75" y="90" class="title">Bounded Catalog Enrichment Sequence</text>
  <text x="75" y="124" class="subtitle">One global task budget; required data fails closed; optional data degrades safely</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="220" height="100" rx="20" fill="#ffe7c7" stroke="#d69b55" class="header"/>
    <text x="180" y="202" class="participant">Caller</text><text x="180" y="232" class="role">product ID iterable</text>
    <rect x="365" y="160" width="240" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="485" y="202" class="participant">Enrichment Service</text><text x="485" y="232" class="role">application policy</text>
    <rect x="680" y="160" width="240" height="100" rx="20" fill="#e8def5" stroke="#8e72b5" class="header"/>
    <text x="800" y="198" class="participant">Core + Collections</text><text x="800" y="225" class="role">core validation</text><text x="800" y="246" class="role">distinct / chunked</text>
    <rect x="995" y="160" width="220" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="1105" y="202" class="participant">map_bounded</text><text x="1105" y="232" class="role">global task owner</text>
    <rect x="1290" y="160" width="210" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="1395" y="202" class="participant">Catalog</text><text x="1395" y="232" class="role">required provider</text>
    <rect x="1550" y="160" width="180" height="100" rx="20" fill="#ffe7c7" stroke="#d69b55" class="header"/>
    <text x="1640" y="202" class="participant">Recommend</text><text x="1640" y="232" class="role">optional provider</text>
  </g>

  <path d="M180 260 V1125" class="lifeline"/><path d="M485 260 V1125" class="lifeline"/>
  <path d="M800 260 V1125" class="lifeline"/><path d="M1105 260 V1125" class="lifeline"/>
  <path d="M1395 260 V1125" class="lifeline"/><path d="M1640 260 V1125" class="lifeline"/>
  <rect x="476" y="300" width="18" height="785" rx="7" class="activation"/>
  <rect x="791" y="365" width="18" height="105" rx="7" class="activation"/>
  <rect x="1096" y="485" width="18" height="485" rx="7" class="activation"/>
  <rect x="1386" y="555" width="18" height="155" rx="7" class="activation"/>
  <rect x="1631" y="610" width="18" height="155" rx="7" class="activation"/>

  <path d="M180 320 H476" class="message callBlue"/>
  <rect x="205" y="287" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="222" y="301" fill="#365f75" class="num">1</text><text x="252" y="309" class="detail">product IDs + limits</text>
  <path d="M494 385 H791" class="message callPurple"/>
  <rect x="520" y="352" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="537" y="366" fill="#65498b" class="num">2</text><text x="567" y="374" class="detail">normalize + validate</text>
  <path d="M791 450 H494" class="message callPurple"/>
  <rect x="520" y="417" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="537" y="431" fill="#65498b" class="num">3</text><text x="567" y="439" class="detail">distinct batches</text>
  <path d="M494 505 H1096" class="message callBlue"/>
  <rect x="520" y="472" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="537" y="486" fill="#365f75" class="num">4</text><text x="567" y="494" class="detail">one ordered required + optional job list</text>
  <path d="M1114 570 H1386" class="message callGreen"/>
  <rect x="1140" y="537" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1157" y="551" fill="#4f7b47" class="num">5</text><text x="1187" y="559" class="detail">fetch required batch</text>
  <path d="M1114 625 H1631" class="message callAmber"/>
  <rect x="1140" y="592" width="34" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="1157" y="606" fill="#8a5c20" class="num">6</text><text x="1187" y="614" class="detail">fetch optional batch</text>

  <rect x="90" y="665" width="1635" height="305" rx="18" class="alt"/>
  <text x="115" y="696" fill="#4f7b47" class="branchLabel">alt valid required response</text>
  <path d="M1386 725 H1114" class="message returnGreen"/>
  <rect x="1140" y="692" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1157" y="706" fill="#4f7b47" class="num">7</text><text x="1187" y="714" class="detail">validated catalog records</text>
  <path d="M1631 775 H1114" class="message returnAmber"/>
  <rect x="1140" y="742" width="34" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="1157" y="756" fill="#8a5c20" class="num">8</text><text x="1187" y="764" class="detail">records or safe optional warning</text>
  <path d="M90 810 H1725" class="branchDivider"/>
  <text x="115" y="842" fill="#a84f42" class="branchLabel">else required outage / invalid response</text>
  <path d="M1395 870 H1114" class="message callRed"/>
  <rect x="1140" y="837" width="34" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="1157" y="851" fill="#a84f42" class="num">9</text><text x="1187" y="859" class="detail">RequiredProviderFailure</text>
  <path d="M90 900 H1725" class="branchDivider"/>
  <text x="115" y="932" fill="#65498b" class="branchLabel">else total timeout / caller cancellation</text>
  <path d="M1105 950 H1010 Q995 950 995 935 V925 Q995 910 1010 910 H1096" class="message callPurple"/>
  <rect x="1018" y="917" width="42" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="1039" y="931" fill="#65498b" class="num">10</text><text x="765" y="943" class="detail">cancel siblings; await cleanup</text>

  <path d="M1096 1015 H494" class="message returnBlue"/>
  <rect x="520" y="982" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="541" y="996" fill="#365f75" class="num">11</text><text x="575" y="1004" class="detail">outcomes / ExceptionGroup / native timeout or cancel</text>
  <path d="M476 1070 H180" class="message returnBlue"/>
  <rect x="205" y="1037" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="226" y="1051" fill="#365f75" class="num">12</text><text x="260" y="1059" class="detail">ordered EnrichedProduct list</text>

  <rect x="90" y="1150" width="1635" height="42" rx="16" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <text x="115" y="1177" class="note">Duplicate IDs share provider work; timeout and cancellation remain native after map_bounded cleans every managed task.</text>
</svg>
