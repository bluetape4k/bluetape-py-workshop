<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="titleId desc">
  <title id="titleId">Integrated order backend request and shutdown sequence</title>
  <desc id="desc">An admitted order is validated before provider work, enriched through one shared cache, encoded safely, and bounded by explicit cancellation and shutdown ownership.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .frame { fill: #fbf8f1; stroke: #d7ccc8; stroke-width: 3; }
      .title { font: 42px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .subtitle { font: 21px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #546e7a; }
      .header { stroke-width: 3; }
      .participant { font: 23px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; text-anchor: middle; }
      .role { font: 15px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; text-anchor: middle; }
      .lifeline { fill: none; stroke: #b0bec5; stroke-width: 3; stroke-dasharray: 10 9; }
      .activation { fill: #dcebf4; stroke: #5f8da8; stroke-width: 2; }
      .callBlue { fill: none; stroke: #5f8da8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .callGreen { fill: none; stroke: #6f9a65; stroke-width: 4; marker-end: url(#arrow-green); }
      .callAmber { fill: none; stroke: #b07a36; stroke-width: 4; marker-end: url(#arrow-amber); }
      .callRed { fill: none; stroke: #c56b5d; stroke-width: 4; marker-end: url(#arrow-red); }
      .callPurple { fill: none; stroke: #8e72b5; stroke-width: 4; marker-end: url(#arrow-purple); }
      .returnBlue { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-blue); }
      .returnGreen { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-green); }
      .returnAmber { fill: none; stroke: #b07a36; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-amber); }
      .label { stroke-width: 2; }
      .num { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .detail { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #37474f; }
      .alt { fill: #ffffff; fill-opacity: 0.10; stroke: #90a4ae; stroke-width: 3; }
      .branchDivider { stroke: #90a4ae; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .branchLabel { font: 18px 'Architects Daughter', 'Comic Sans MS', cursive; font-weight: 700; }
      .note { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8da8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f9a65"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b07a36"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c56b5d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8e72b5"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#455a64" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="35" y="35" width="1730" height="1440" rx="28" class="frame"/>
  <text x="75" y="90" class="title">Integrated Order Backend Sequence</text>
  <text x="75" y="124" class="subtitle">Validation finishes before provider I/O; one task owner bounds request timeout, cache cleanup, and shutdown</text>

  <g filter="url(#shadow)">
    <rect x="65" y="160" width="220" height="100" rx="20" fill="#ffe7c7" stroke="#d69b55" class="header"/>
    <text x="175" y="202" class="participant">Caller / CLI</text><text x="175" y="232" class="role">two order scenario</text>
    <rect x="350" y="160" width="240" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="470" y="202" class="participant">Application</text><text x="470" y="232" class="role">task + deadline owner</text>
    <rect x="650" y="160" width="240" height="100" rx="20" fill="#e8def5" stroke="#8e72b5" class="header"/>
    <text x="770" y="202" class="participant">Order Service</text><text x="770" y="232" class="role">aggregate policy</text>
    <rect x="950" y="160" width="240" height="100" rx="20" fill="#f6ddd7" stroke="#c56b5d" class="header"/>
    <text x="1070" y="202" class="participant">Focused Services</text><text x="1070" y="232" class="role">intake + enrichment</text>
    <rect x="1250" y="160" width="220" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="1360" y="202" class="participant">Async Catalog</text><text x="1360" y="232" class="role">shared TTL cache</text>
    <rect x="1530" y="160" width="210" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="1635" y="202" class="participant">JSON Payload</text><text x="1635" y="232" class="role">bounded artifact</text>
  </g>

  <path d="M175 260 V1415" class="lifeline"/><path d="M470 260 V1415" class="lifeline"/>
  <path d="M770 260 V1415" class="lifeline"/><path d="M1070 260 V1415" class="lifeline"/>
  <path d="M1360 260 V1415" class="lifeline"/><path d="M1635 260 V1415" class="lifeline"/>
  <rect x="461" y="295" width="18" height="1125" rx="7" class="activation"/>
  <rect x="761" y="390" width="18" height="800" rx="7" class="activation"/>
  <rect x="1061" y="450" width="18" height="790" rx="7" class="activation"/>
  <rect x="1351" y="565" width="18" height="690" rx="7" class="activation"/>
  <rect x="1626" y="705" width="18" height="200" rx="7" class="activation"/>

  <path d="M175 315 H461" class="message callBlue"/>
  <rect x="202" y="282" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="219" y="296" fill="#365f75" class="num">1</text><text x="249" y="304" class="detail">process(order)</text>
  <path d="M470 375 H545 Q560 375 560 360 V345 Q560 330 545 330 H479" class="message callBlue"/>
  <rect x="497" y="337" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="514" y="351" fill="#365f75" class="num">2</text><text x="575" y="359" class="detail">create + track named request task</text>

  <rect x="85" y="405" width="1650" height="850" rx="18" class="alt"/>
  <text x="110" y="437" fill="#4f7b47" class="branchLabel">alt request completes within overall deadline</text>
  <path d="M479 465 H761" class="message callPurple"/>
  <rect x="505" y="432" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="522" y="446" fill="#65498b" class="num">3</text><text x="552" y="454" class="detail">process aggregate</text>
  <path d="M779 525 H1061" class="message callRed"/>
  <rect x="805" y="492" width="34" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="822" y="506" fill="#a84f42" class="num">4</text><text x="852" y="514" class="detail">validate every line before provider I/O</text>
  <path d="M779 585 H1061" class="message callBlue"/>
  <rect x="805" y="552" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="822" y="566" fill="#365f75" class="num">5</text><text x="852" y="574" class="detail">enrich normalized occurrences</text>
  <path d="M1079 645 H1351" class="message callGreen"/>
  <rect x="1105" y="612" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1122" y="626" fill="#4f7b47" class="num">6</text><text x="1152" y="634" class="detail">get distinct products</text>
  <path d="M1351 700 H1079" class="message returnGreen"/>
  <rect x="1105" y="667" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1122" y="681" fill="#4f7b47" class="num">7</text><text x="1152" y="689" class="detail">cache hit or loaded records</text>
  <rect x="790" y="715" width="670" height="145" rx="15" class="alt"/>
  <text x="1120" y="741" fill="#4f7b47" class="branchLabel">alt optional record available</text>
  <path d="M1079 765 H779" class="message returnGreen"/>
  <rect x="805" y="732" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="822" y="746" fill="#4f7b47" class="num">8</text><text x="852" y="754" class="detail">ordered enriched products</text>
  <path d="M790 790 H1460" class="branchDivider"/>
  <text x="1115" y="817" fill="#8a5c20" class="branchLabel">else missing or unavailable</text>
  <path d="M1079 835 H779" class="message returnAmber"/>
  <rect x="805" y="802" width="34" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="822" y="816" fill="#8a5c20" class="num">9</text><text x="852" y="824" class="detail">safe optional warning</text>
  <path d="M779 895 H1626" class="message callGreen"/>
  <rect x="805" y="862" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="826" y="876" fill="#4f7b47" class="num">10</text><text x="860" y="884" class="detail">encode allowlisted JSON with fixed limits</text>
  <path d="M761 940 H479" class="message returnGreen"/>
  <rect x="505" y="907" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="526" y="921" fill="#4f7b47" class="num">11</text><text x="560" y="929" class="detail">ProcessedOrder</text>
  <path d="M461 980 H175" class="message returnBlue"/>
  <rect x="202" y="947" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="223" y="961" fill="#365f75" class="num">12</text><text x="257" y="969" class="detail">safe result event</text>
  <path d="M85 1000 H1735" class="branchDivider"/>
  <text x="110" y="1030" fill="#a84f42" class="branchLabel">else invalid aggregate or line</text>
  <path d="M761 1070 H479" class="message callRed"/>
  <rect x="505" y="1037" width="42" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="526" y="1051" fill="#a84f42" class="num">13</text><text x="560" y="1059" class="detail">indexed error; no provider call</text>
  <path d="M85 1090 H1735" class="branchDivider"/>
  <text x="110" y="1120" fill="#a84f42" class="branchLabel">else overall timeout or caller cancellation</text>
  <path d="M479 1160 H761" class="message callRed"/>
  <rect x="505" y="1127" width="42" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="526" y="1141" fill="#a84f42" class="num">14</text><text x="560" y="1149" class="detail">cancel owned request; return promptly</text>
  <path d="M1070 1220 H1260 Q1275 1220 1275 1205 V1190 Q1275 1175 1290 1175 H1351" class="message callAmber"/>
  <rect x="1120" y="1187" width="42" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="1141" y="1201" fill="#8a5c20" class="num">15</text><text x="1175" y="1209" class="detail">cache loader cleanup stays observed</text>

  <path d="M175 1300 H461" class="message callBlue"/>
  <rect x="202" y="1267" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="223" y="1281" fill="#365f75" class="num">16</text><text x="257" y="1289" class="detail">aclose()</text>
  <path d="M470 1360 H560 Q575 1360 575 1345 V1330 Q575 1315 560 1315 H479" class="message callPurple"/>
  <rect x="497" y="1322" width="42" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="518" y="1336" fill="#65498b" class="num">17</text><text x="590" y="1344" class="detail">snapshot; finite grace; cancel; finite wait</text>
  <path d="M461 1405 H175" class="message returnGreen"/>
  <rect x="202" y="1372" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="223" y="1386" fill="#4f7b47" class="num">18</text><text x="257" y="1394" class="detail">closed or retryable pending-count error</text>

  <rect x="85" y="1435" width="1650" height="32" rx="16" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <text x="110" y="1457" class="note">Validation precedes provider work; duplicate SKUs share cache entries; late failures remain observed after timeout or shutdown.</text>
</svg>
