<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="titleId desc">
  <title id="titleId">Validated order intake sequence</title>
  <desc id="desc">Success and failure paths share deterministic validation, contextual logging, and guaranteed context reset.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .frame { fill: #fbf8f1; stroke: #d7ccc8; stroke-width: 3; }
      .title { font: 42px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .subtitle { font: 21px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #546e7a; }
      .header { stroke-width: 3; }
      .participant { font: 25px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; text-anchor: middle; }
      .role { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; text-anchor: middle; }
      .lifeline { fill: none; stroke: #b0bec5; stroke-width: 3; stroke-dasharray: 10 9; }
      .activation { fill: #dcebf4; stroke: #5f8da8; stroke-width: 2; }
      .callBlue { fill: none; stroke: #5f8da8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .callGreen { fill: none; stroke: #6f9a65; stroke-width: 4; marker-end: url(#arrow-green); }
      .callRed { fill: none; stroke: #c56b5d; stroke-width: 4; marker-end: url(#arrow-red); }
      .callPurple { fill: none; stroke: #8e72b5; stroke-width: 4; marker-end: url(#arrow-purple); }
      .return { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-green); }
      .returnBlue { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-blue); }
      .label { stroke-width: 2; }
      .num { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .detail { font: 17px 'Comic Mono', 'SFMono-Regular', monospace; fill: #37474f; }
      .alt { fill: #ffffff; fill-opacity: 0.10; stroke: #90a4ae; stroke-width: 3; }
      .branchDivider { stroke: #90a4ae; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .branchLabel { font: 19px 'Architects Daughter', 'Comic Sans MS', cursive; font-weight: 700; }
      .note { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8da8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f9a65"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c56b5d"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8e72b5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#455a64" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="35" y="35" width="1730" height="1130" rx="28" class="frame"/>
  <text x="75" y="90" class="title">Validated Order Intake Sequence</text>
  <text x="75" y="124" class="subtitle">One policy boundary; explicit success and failure; context always resets</text>

  <g filter="url(#shadow)">
    <rect x="85" y="160" width="230" height="100" rx="20" fill="#ffe7c7" stroke="#d69b55" class="header"/>
    <text x="200" y="202" class="participant">Partner Caller</text>
    <text x="200" y="232" class="role">request boundary</text>
    <rect x="435" y="160" width="230" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="550" y="202" class="participant">Order Intake</text>
    <text x="550" y="232" class="role">application policy</text>
    <rect x="785" y="160" width="230" height="100" rx="20" fill="#e8def5" stroke="#8e72b5" class="header"/>
    <text x="900" y="202" class="participant">bluetape-core</text>
    <text x="900" y="232" class="role">validation primitives</text>
    <rect x="1135" y="160" width="230" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="1250" y="202" class="participant">Log Context</text>
    <text x="1250" y="232" class="role">scoped metadata</text>
    <rect x="1485" y="160" width="230" height="100" rx="20" fill="#f6ddd7" stroke="#c56b5d" class="header"/>
    <text x="1600" y="202" class="participant">App Handler</text>
    <text x="1600" y="232" class="role">filter + output</text>
  </g>

  <path d="M200 260 V1075" class="lifeline"/>
  <path d="M550 260 V1075" class="lifeline"/>
  <path d="M900 260 V1075" class="lifeline"/>
  <path d="M1250 260 V1075" class="lifeline"/>
  <path d="M1600 260 V1075" class="lifeline"/>
  <rect x="541" y="300" width="18" height="735" rx="7" class="activation"/>
  <rect x="891" y="410" width="18" height="65" rx="7" class="activation"/>
  <rect x="1241" y="350" width="18" height="620" rx="7" class="activation"/>
  <rect x="1591" y="540" width="18" height="275" rx="7" class="activation"/>

  <path d="M200 315 H541" class="callBlue"/>
  <rect x="224" y="286" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/>
  <text x="241" y="300" fill="#365f75" class="num">1</text>
  <text x="270" y="307" class="detail">command + request IDs</text>

  <path d="M559 365 H1241" class="callBlue"/>
  <rect x="585" y="336" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/>
  <text x="602" y="350" fill="#365f75" class="num">2</text>
  <text x="632" y="357" class="detail">open log_context</text>

  <path d="M559 425 H891" class="callPurple"/>
  <rect x="585" y="396" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/>
  <text x="602" y="410" fill="#65498b" class="num">3</text>
  <text x="632" y="417" class="detail">validate in deterministic order</text>

  <path d="M891 470 H559" class="callPurple"/>
  <rect x="585" y="441" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/>
  <text x="602" y="455" fill="#65498b" class="num">4</text>
  <text x="632" y="462" class="detail">value or library error</text>

  <rect x="105" y="495" width="1590" height="340" rx="18" class="alt"/>
  <text x="130" y="526" fill="#4f7b47" class="branchLabel">alt valid command</text>

  <path d="M559 565 H1591" class="callGreen"/>
  <rect x="585" y="536" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/>
  <text x="602" y="550" fill="#4f7b47" class="num">5</text>
  <text x="632" y="557" class="detail">emit order_intake.accepted</text>

  <path d="M541 625 H200" class="return"/>
  <rect x="468" y="596" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/>
  <text x="485" y="610" fill="#4f7b47" class="num">6</text>
  <text x="245" y="617" class="detail">AcceptedOrder</text>

  <path d="M105 660 H1695" class="branchDivider"/>
  <text x="130" y="694" fill="#a84f42" class="branchLabel">else invalid command</text>

  <path d="M559 720 H640 Q650 720 650 730 V755 Q650 765 640 765 H559" class="callRed"/>
  <rect x="585" y="691" width="34" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/>
  <text x="602" y="705" fill="#a84f42" class="num">7</text>
  <text x="675" y="747" class="detail">map to safe public problem</text>

  <path d="M559 805 H1591" class="callRed"/>
  <rect x="585" y="776" width="34" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/>
  <text x="602" y="790" fill="#a84f42" class="num">8</text>
  <text x="632" y="797" class="detail">emit order_intake.rejected</text>

  <path d="M559 900 H1241" class="callPurple"/>
  <rect x="585" y="871" width="34" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/>
  <text x="602" y="885" fill="#65498b" class="num">9</text>
  <text x="632" y="892" class="detail">exit scope; reset context</text>

  <path d="M541 985 H200" class="returnBlue"/>
  <rect x="224" y="956" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/>
  <text x="245" y="970" fill="#365f75" class="num">10</text>
  <text x="280" y="977" class="detail">result or InvalidOrderCommand</text>

  <rect x="105" y="1090" width="1590" height="48" rx="16" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <text x="130" y="1121" class="note">Only non-secret correlation IDs enter log context; SKU, quantity, and sensitive payloads stay out.</text>
</svg>
