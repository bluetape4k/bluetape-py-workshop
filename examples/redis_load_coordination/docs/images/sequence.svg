<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">Redis owner follower and local hit sequence</title>
  <desc id="desc">Instance A misses its local cache, acquires the Redis lease, and loads once. Instance B misses its separate cache, follows the lease, reuses the matching result envelope, then serves its next request locally. Failure branches remain bounded and never fall back to an uncoordinated load.</desc>
  <defs>
    <style>
      text { font-family: 'Architects Daughter', 'Comic Sans MS', 'Comic Mono', 'SFMono-Regular', monospace; }
      .frame { fill: #fbf8f1; stroke: #d7ccc8; stroke-width: 3; }
      .title { font-size: 42px; fill: #263238; }
      .subtitle { font-size: 20px; fill: #546e7a; }
      .header { stroke-width: 3; }
      .participant { font-size: 21px; fill: #263238; text-anchor: middle; }
      .role { font-family: 'Comic Mono', 'SFMono-Regular', monospace; font-size: 13px; fill: #546e7a; text-anchor: middle; }
      .lifeline { fill: none; stroke: #b0bec5; stroke-width: 3; stroke-dasharray: 10 9; }
      .activation { fill: #dcebf4; stroke: #5f8da8; stroke-width: 2; }
      .callBlue { fill: none; stroke: #5f8da8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .callGreen { fill: none; stroke: #6f9a65; stroke-width: 4; marker-end: url(#arrow-green); }
      .callAmber { fill: none; stroke: #b07a36; stroke-width: 4; marker-end: url(#arrow-amber); }
      .callRed { fill: none; stroke: #c56b5d; stroke-width: 4; marker-end: url(#arrow-red); }
      .callPurple { fill: none; stroke: #8e72b5; stroke-width: 4; marker-end: url(#arrow-purple); }
      .returnBlue { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-blue); }
      .returnGreen { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-green); }
      .returnAmber { fill: none; stroke: #b07a36; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-amber); }
      .returnRed { fill: none; stroke: #c56b5d; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-red); }
      .returnPurple { fill: none; stroke: #8e72b5; stroke-width: 4; stroke-dasharray: 10 7; marker-end: url(#arrow-purple); }
      .label { stroke-width: 2; }
      .num { font-family: 'Comic Mono', 'SFMono-Regular', monospace; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .detail { font-family: 'Comic Mono', 'SFMono-Regular', monospace; font-size: 15px; fill: #37474f; }
      .alt { fill: #ffffff; fill-opacity: 0.10; stroke: #90a4ae; stroke-width: 3; }
      .branchDivider { stroke: #90a4ae; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .branchLabel { font-size: 18px; font-weight: 700; }
      .note { font-family: 'Comic Mono', 'SFMono-Regular', monospace; font-size: 15px; fill: #546e7a; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8da8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f9a65"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b07a36"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c56b5d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8e72b5"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#455a64" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="35" y="35" width="1730" height="1430" rx="28" class="frame"/>
  <text x="75" y="90" class="title">Redis Load Coordination Sequence</text>
  <text x="75" y="124" class="subtitle">A loads once; B reuses the owner-bound envelope; B's next request never enters Redis</text>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="190" height="100" rx="20" fill="#ffe7c7" stroke="#d69b55" class="header"/>
    <text x="150" y="202" class="participant">Caller</text><text x="150" y="232" class="role">same SKU-42</text>
    <rect x="295" y="160" width="190" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="390" y="202" class="participant">Instance A</text><text x="390" y="232" class="role">owner candidate</text>
    <rect x="535" y="160" width="190" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="630" y="202" class="participant">Cache A</text><text x="630" y="232" class="role">process-local</text>
    <rect x="775" y="160" width="190" height="100" rx="20" fill="#ffe7c7" stroke="#b07a36" class="header"/>
    <text x="870" y="202" class="participant">Redis 8</text><text x="870" y="232" class="role">lease + envelope</text>
    <rect x="1015" y="160" width="190" height="100" rx="20" fill="#dcebf4" stroke="#5f8da8" class="header"/>
    <text x="1110" y="202" class="participant">Instance B</text><text x="1110" y="232" class="role">follower</text>
    <rect x="1255" y="160" width="190" height="100" rx="20" fill="#e3f0df" stroke="#6f9a65" class="header"/>
    <text x="1350" y="202" class="participant">Cache B</text><text x="1350" y="232" class="role">separate local cache</text>
    <rect x="1495" y="160" width="190" height="100" rx="20" fill="#f6ddd7" stroke="#c56b5d" class="header"/>
    <text x="1590" y="202" class="participant">Loader</text><text x="1590" y="232" class="role">authoritative source</text>
  </g>

  <path d="M150 260 V1400" class="lifeline"/><path d="M390 260 V1400" class="lifeline"/>
  <path d="M630 260 V1400" class="lifeline"/><path d="M870 260 V1400" class="lifeline"/>
  <path d="M1110 260 V1400" class="lifeline"/><path d="M1350 260 V1400" class="lifeline"/>
  <path d="M1590 260 V1400" class="lifeline"/>
  <rect x="381" y="305" width="18" height="780" rx="7" class="activation"/>
  <rect x="861" y="475" width="18" height="600" rx="7" class="activation"/>
  <rect x="1101" y="630" width="18" height="655" rx="7" class="activation"/>
  <rect x="1581" y="555" width="18" height="230" rx="7" class="activation"/>

  <rect x="70" y="285" width="1660" height="1080" rx="18" class="alt"/>
  <text x="95" y="318" fill="#4f7b47" class="branchLabel">alt owner + follower succeed within finite budgets</text>

  <path d="M150 350 H381" class="message callBlue"/>
  <rect x="177" y="317" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="194" y="331" fill="#365f75" class="num">1</text><text x="225" y="339" class="detail">A.get_product(SKU-42)</text>
  <path d="M399 405 H621" class="message callGreen"/>
  <rect x="425" y="372" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="442" y="386" fill="#4f7b47" class="num">2</text><text x="472" y="394" class="detail">local lookup</text>
  <path d="M621 455 H399" class="message returnGreen"/>
  <rect x="425" y="422" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="442" y="436" fill="#4f7b47" class="num">3</text><text x="472" y="444" class="detail">miss</text>
  <path d="M399 505 H861" class="message callAmber"/>
  <rect x="425" y="472" width="34" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="442" y="486" fill="#8a5c20" class="num">4</text><text x="472" y="494" class="detail">SET_IF_ABSENT lease</text>
  <path d="M861 550 H399" class="message returnAmber"/>
  <rect x="425" y="517" width="34" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="442" y="531" fill="#8a5c20" class="num">5</text><text x="472" y="539" class="detail">lease acquired</text>
  <path d="M399 595 H1581" class="message callRed"/>
  <rect x="425" y="562" width="34" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="442" y="576" fill="#a84f42" class="num">6</text><text x="472" y="584" class="detail">load once</text>

  <path d="M150 650 H1101" class="message callBlue"/>
  <rect x="177" y="617" width="34" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="194" y="631" fill="#365f75" class="num">7</text><text x="225" y="639" class="detail">B.get_product(SKU-42)</text>
  <path d="M1119 700 H1341" class="message callGreen"/>
  <rect x="1145" y="667" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1162" y="681" fill="#4f7b47" class="num">8</text><text x="1192" y="689" class="detail">separate local lookup</text>
  <path d="M1341 750 H1119" class="message returnGreen"/>
  <rect x="1145" y="717" width="34" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1162" y="731" fill="#4f7b47" class="num">9</text><text x="1192" y="739" class="detail">miss</text>
  <path d="M1101 800 H879" class="message callAmber"/>
  <rect x="905" y="767" width="42" height="28" rx="14" fill="#ffe7c7" stroke="#b07a36" class="label"/><text x="926" y="781" fill="#8a5c20" class="num">10</text><text x="960" y="789" class="detail">lease busy; bounded poll</text>
  <path d="M1581 850 H399" class="message returnRed"/>
  <rect x="425" y="817" width="42" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="446" y="831" fill="#a84f42" class="num">11</text><text x="480" y="839" class="detail">ProductSummary</text>
  <path d="M399 900 H861" class="message callPurple"/>
  <rect x="425" y="867" width="42" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="446" y="881" fill="#65498b" class="num">12</text><text x="480" y="889" class="detail">publish owner-bound result envelope</text>
  <path d="M879 950 H1101" class="message returnPurple"/>
  <rect x="905" y="917" width="42" height="28" rx="14" fill="#e8def5" stroke="#8e72b5" class="label"/><text x="926" y="931" fill="#65498b" class="num">13</text><text x="960" y="939" class="detail">matching envelope</text>
  <path d="M1119 1000 H1341" class="message callGreen"/>
  <rect x="1145" y="967" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1166" y="981" fill="#4f7b47" class="num">14</text><text x="1200" y="989" class="detail">populate Cache B</text>
  <path d="M1101 1050 H150" class="message returnBlue"/>
  <rect x="177" y="1017" width="42" height="28" rx="14" fill="#dcebf4" stroke="#5f8da8" class="label"/><text x="198" y="1031" fill="#365f75" class="num">15</text><text x="232" y="1039" class="detail">RESULT_REUSED</text>

  <rect x="980" y="1068" width="710" height="160" rx="15" class="alt"/>
  <text x="1005" y="1099" fill="#4f7b47" class="branchLabel">loop next B request</text>
  <path d="M1110 1140 H1341" class="message callGreen"/>
  <rect x="1145" y="1107" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1166" y="1121" fill="#4f7b47" class="num">16</text><text x="1200" y="1129" class="detail">local lookup</text>
  <path d="M1341 1190 H1119" class="message returnGreen"/>
  <rect x="1145" y="1157" width="42" height="28" rx="14" fill="#e3f0df" stroke="#6f9a65" class="label"/><text x="1166" y="1171" fill="#4f7b47" class="num">17</text><text x="1200" y="1179" class="detail">local hit; no Redis event</text>

  <path d="M70 1245 H1730" class="branchDivider"/>
  <text x="95" y="1277" fill="#a84f42" class="branchLabel">else timeout, provider, or envelope failure</text>
  <path d="M879 1310 H1101" class="message returnRed"/>
  <rect x="905" y="1277" width="42" height="28" rx="14" fill="#f6ddd7" stroke="#c56b5d" class="label"/><text x="926" y="1291" fill="#a84f42" class="num">18</text><text x="960" y="1299" class="detail">stable exception; no fallback loader</text>
  <path d="M70 1330 H1730" class="branchDivider"/>
  <text x="95" y="1362" fill="#a84f42" class="branchLabel">else caller cancellation preserves CancelledError and bounded cleanup</text>

  <rect x="70" y="1410" width="1660" height="38" rx="18" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <text x="95" y="1435" class="note">Redis coordinates a cold miss only; each instance populates its own local cache; no timing sleep or uncoordinated fallback is used.</text>
</svg>
