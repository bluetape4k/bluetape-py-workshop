<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded payload processing architecture</title>
  <desc id="desc">The caller explicitly chooses either the default untrusted JSON service or the optional trusted-internal Fory service. Both apply encoded, compressed, and decompressed size limits before deserialization.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .title { font: 42px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .subtitle { font: 21px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #546e7a; }
      .lane-title { font: 26px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #37474f; }
      .card-title { font: 23px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .body { font: 17px 'Comic Mono', 'SFMono-Regular', monospace; fill: #455a64; }
      .small { font: 15px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; }
      .lane { stroke: #cfd8dc; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .card { stroke-width: 3; }
      .flow { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .safe { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .optional { fill: none; stroke: #8e72b5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f8da8"/></marker>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#6f9a65"/></marker>
    <marker id="arrow-purple" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#8e72b5"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#455a64" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#fbf8f1"/>
  <path d="M70 115 H1530" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="68" class="title">Bounded Payload Processing</text>
  <text x="70" y="101" class="subtitle">Explicit trust profiles; limits are checked before optional deserialization</text>

  <rect x="70" y="150" width="340" height="610" rx="26" fill="#f7eee7" class="lane"/>
  <rect x="445" y="150" width="500" height="610" rx="26" fill="#eef3f6" class="lane"/>
  <rect x="980" y="150" width="550" height="610" rx="26" fill="#edf5ed" class="lane"/>
  <text x="95" y="190" class="lane-title">Caller / composition root</text>
  <text x="470" y="190" class="lane-title">Fixed-format services</text>
  <text x="1005" y="190" class="lane-title">bluetape-serde pipeline</text>

  <g filter="url(#shadow)">
    <rect x="105" y="235" width="270" height="180" rx="20" fill="#ffe7c7" stroke="#d69b55" class="card"/>
    <text x="130" y="278" class="card-title">Composition Root</text>
    <text x="130" y="316" class="body">chooses one service</text>
    <text x="130" y="346" class="body">sets all byte limits</text>
    <text x="130" y="378" class="small">never trusts payload metadata</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="105" y="520" width="270" height="145" rx="20" fill="#e3f0df" stroke="#6f9a65" class="card"/>
    <text x="130" y="563" class="card-title">EncodedPayload</text>
    <text x="130" y="601" class="body">data + exact metadata</text>
    <text x="130" y="633" class="small">base64url transport envelope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="225" width="420" height="205" rx="20" fill="#dcebf4" stroke="#5f8da8" class="card"/>
    <text x="510" y="268" class="card-title">JsonPayloadService</text>
    <text x="510" y="306" class="body">JSON v1 + gzip + base64url</text>
    <text x="510" y="336" class="body">TrustProfile.UNTRUSTED</text>
    <text x="510" y="368" class="small">default environment; safe input</text>
    <text x="510" y="398" class="small">no provider registration required</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="485" y="490" width="420" height="205" rx="20" fill="#e8def5" stroke="#8e72b5" class="card"/>
    <text x="510" y="533" class="card-title">ForyPayloadService</text>
    <text x="510" y="571" class="body">Fory v1 + gzip + base64url</text>
    <text x="510" y="601" class="body">TrustProfile.TRUSTED_INTERNAL</text>
    <text x="510" y="633" class="small">optional pyfory==1.3.0 environment</text>
    <text x="510" y="663" class="small">fixed root type + schema id</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="215" width="470" height="125" rx="20" fill="#ffe7c7" stroke="#d69b55" class="card"/>
    <text x="1045" y="258" class="card-title">1. Envelope preflight</text>
    <text x="1045" y="296" class="body">algorithm metadata + encoded bytes</text>
    <text x="1045" y="326" class="small">reject before codec/provider execution</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1020" y="385" width="470" height="125" rx="20" fill="#dcebf4" stroke="#5f8da8" class="card"/>
    <text x="1045" y="428" class="card-title">2. Decode + compressed bound</text>
    <text x="1045" y="466" class="body">base64url decode, then byte count</text>
    <text x="1045" y="496" class="small">max_encoded_size / max_compressed_size</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1020" y="555" width="470" height="125" rx="20" fill="#e3f0df" stroke="#6f9a65" class="card"/>
    <text x="1045" y="598" class="card-title">3. Bounded decompress + serde</text>
    <text x="1045" y="636" class="body">gzip output limit, then JSON / Fory</text>
    <text x="1045" y="666" class="small">DecompressionLimitError stays visible</text>
  </g>

  <path d="M375 320 H485" class="flow"/>
  <path d="M375 590 H420 Q435 590 435 575 V340 Q435 325 450 325 H485" class="flow"/>
  <path d="M375 590 H485" class="optional"/>
  <path d="M905 325 H1020" class="flow"/>
  <path d="M905 590 H950 Q965 590 965 575 V340 Q965 325 980 325 H1020" class="optional"/>
  <path d="M1255 340 V385" class="flow"/>
  <path d="M1255 510 V555" class="safe"/>

  <rect x="70" y="800" width="1460" height="58" rx="18" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <circle cx="105" cy="829" r="9" fill="#5f8da8"/>
  <text x="125" y="836" class="small">Default: untrusted JSON; callers can run it without optional providers</text>
  <circle cx="835" cy="829" r="9" fill="#8e72b5"/>
  <text x="855" y="836" class="small">Optional: trusted Fory is selected only by an explicit composition root</text>
</svg>
