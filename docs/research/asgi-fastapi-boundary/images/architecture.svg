<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">ASGI and FastAPI workshop ownership</title>
  <desc id="desc">Static responsibility boundaries for the first HTTP order example and the gated future bluetape-fastapi adapter.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Comic+Mono&amp;display=swap');
      .title { font: 44px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .subtitle { font: 22px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #546e7a; }
      .lane-title { font: 27px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #37474f; }
      .card-title { font: 23px 'Architects Daughter', 'Comic Sans MS', cursive; fill: #263238; }
      .body { font: 17px 'Comic Mono', 'SFMono-Regular', monospace; fill: #455a64; }
      .small { font: 15px 'Comic Mono', 'SFMono-Regular', monospace; fill: #546e7a; }
      .lane { stroke: #cfd8dc; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .card { stroke-width: 3; }
      .flow { fill: none; stroke: #5f8da8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .context { fill: none; stroke: #8e72b5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .lifecycle { fill: none; stroke: #6f9a65; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .future { fill: none; stroke: #b07a36; stroke-width: 4; stroke-dasharray: 12 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .label-box { fill: #fffdf8; stroke: #cfd8dc; stroke-width: 1.5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#5f8da8"/></marker>
    <marker id="arrow-purple" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#8e72b5"/></marker>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#6f9a65"/></marker>
    <marker id="arrow-amber" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#b07a36"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#455a64" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1800" height="1050" fill="#fbf8f1"/>
  <path d="M70 118 H1730" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="70" class="title">ASGI + FastAPI Workshop Boundary</text>
  <text x="70" y="104" class="subtitle">FastAPI owns transport policy; the existing order backend owns business work and task lifecycle</text>

  <rect x="60" y="155" width="270" height="745" rx="26" fill="#f7eee7" class="lane"/>
  <rect x="365" y="155" width="600" height="745" rx="26" fill="#eef3f6" class="lane"/>
  <rect x="1000" y="155" width="430" height="745" rx="26" fill="#edf5ed" class="lane"/>
  <rect x="1465" y="155" width="275" height="745" rx="26" fill="#f6f0e8" class="lane"/>
  <text x="88" y="198" class="lane-title">Protocol edge</text>
  <text x="393" y="198" class="lane-title">Workshop-owned FastAPI transport</text>
  <text x="1028" y="198" class="lane-title">Existing backend ownership</text>
  <text x="1493" y="198" class="lane-title">Upstream gate</text>

  <g filter="url(#shadow)">
    <rect x="95" y="275" width="200" height="150" rx="20" fill="#ffe7c7" stroke="#d69b55" class="card"/>
    <text x="120" y="318" class="card-title">Client</text>
    <text x="120" y="356" class="body">POST /orders</text>
    <text x="120" y="389" class="small">bounded JSON body</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="610" width="200" height="160" rx="20" fill="#dcebf4" stroke="#5f8da8" class="card"/>
    <text x="120" y="652" class="card-title">ASGI server</text>
    <text x="120" y="690" class="body">lifespan + HTTP</text>
    <text x="120" y="722" class="small">disconnect is a signal</text>
    <text x="120" y="749" class="small">not auto cancellation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="245" width="250" height="185" rx="20" fill="#dcebf4" stroke="#5f8da8" class="card"/>
    <text x="430" y="287" class="card-title">FastAPI endpoint</text>
    <text x="430" y="325" class="body">DTO + request parsing</text>
    <text x="430" y="357" class="body">DI + response allowlist</text>
    <text x="430" y="389" class="small">public exception mapping</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="245" width="225" height="185" rx="20" fill="#e8def5" stroke="#8e72b5" class="card"/>
    <text x="725" y="287" class="card-title">Context boundary</text>
    <text x="725" y="325" class="body">correlation + request</text>
    <text x="725" y="357" class="body">token reset in finally</text>
    <text x="725" y="389" class="small">all terminal paths</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="600" width="390" height="170" rx="20" fill="#e3f0df" stroke="#6f9a65" class="card"/>
    <text x="495" y="642" class="card-title">FastAPI lifespan</text>
    <text x="495" y="680" class="body">startup: build one backend</text>
    <text x="495" y="712" class="body">shutdown: await aclose()</text>
    <text x="495" y="744" class="small">no global or per-request backend</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="250" width="350" height="205" rx="20" fill="#e8def5" stroke="#8e72b5" class="card"/>
    <text x="1065" y="293" class="body">OrderBackendApplication</text>
    <text x="1065" y="332" class="body">overall request deadline</text>
    <text x="1065" y="365" class="body">owned task cancellation</text>
    <text x="1065" y="398" class="body">late failure observation</text>
    <text x="1065" y="430" class="small">retryable finite shutdown</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1040" y="590" width="350" height="185" rx="20" fill="#e3f0df" stroke="#6f9a65" class="card"/>
    <text x="1065" y="633" class="card-title">OrderBackendService</text>
    <text x="1065" y="672" class="body">domain validation first</text>
    <text x="1065" y="705" class="body">enrichment + shared cache</text>
    <text x="1065" y="738" class="small">bounded untrusted JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1500" y="285" width="205" height="200" rx="20" fill="#ffe7c7" stroke="#d69b55" stroke-dasharray="10 7" class="card"/>
    <text x="1525" y="327" class="card-title">Future adapter</text>
    <text x="1525" y="365" class="body">bluetape-fastapi</text>
    <text x="1525" y="400" class="small">#21 decision accepted</text>
    <text x="1525" y="430" class="small">#22 implementation ships</text>
    <text x="1525" y="460" class="small">exact tag or commit</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1500" y="630" width="205" height="150" rx="20" fill="#f6ddd7" stroke="#c56b5d" class="card"/>
    <text x="1525" y="672" class="card-title">Unavailable now</text>
    <text x="1525" y="710" class="body">no copied adapter</text>
    <text x="1525" y="742" class="small">no dependency claim</text>
  </g>

  <path d="M295 350 H405" class="flow"/>
  <path d="M655 330 H700" class="context"/>
  <path d="M925 330 H1040" class="context"/>
  <path d="M1215 455 V590" class="lifecycle"/>
  <path d="M295 680 H470" class="lifecycle"/>
  <path d="M860 680 H940 Q958 680 958 662 V475 Q958 457 976 457 H1040" class="lifecycle"/>
  <path d="M1500 385 H1455 Q1438 385 1438 368 V330 Q1438 313 1421 313 H1390" class="future"/>

  <g>
    <rect x="315" y="312" width="72" height="29" rx="14" class="label-box"/><text x="329" y="333" class="small">HTTP</text>
    <rect x="948" y="292" width="77" height="29" rx="14" class="label-box"/><text x="961" y="313" class="small">delegate</text>
    <rect x="1320" y="267" width="125" height="29" rx="14" class="label-box"/><text x="1334" y="288" class="small">future only</text>
  </g>

  <rect x="60" y="940" width="1680" height="64" rx="18" fill="#f0ebe2" stroke="#d7ccc8" stroke-width="2"/>
  <circle cx="100" cy="972" r="9" fill="#5f8da8"/><text x="120" y="979" class="small">Workshop owns FastAPI transport policy</text>
  <circle cx="610" cy="972" r="9" fill="#8e72b5"/><text x="630" y="979" class="small">Backend owns request tasks, deadlines, and business work</text>
  <circle cx="1260" cy="972" r="9" fill="#b07a36"/><text x="1280" y="979" class="small">Dashed path requires #21 + #22 + exact ref</text>
</svg>
